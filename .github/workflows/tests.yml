name: Pruebas NBA Props Lab
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q tests
      - run: python -m compileall -q app.py cli.py model.py fetch_nba.py shared_data.py odds_integration.py tracker.py diagnostics.py make_demo.py
